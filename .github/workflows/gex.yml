name: gex-levels

on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub's minimum; scheduled runs are often a few minutes late
  workflow_dispatch: {}        # "Run workflow" button for a manual update

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gex-levels
  cancel-in-progress: false

jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calculate GEX levels
        run: python gex.py
        env:
          # optional: one "GexRun" event per instrument to New Relic (Settings -> Secrets and variables -> Actions)
          NR_ACCOUNT_ID: ${{ secrets.NR_ACCOUNT_ID }}
          NR_INSERT_KEY: ${{ secrets.NR_INSERT_KEY }}
          NR_REGION: ${{ vars.NR_REGION }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
