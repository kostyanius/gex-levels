name: gex-levels

on:
  schedule:
    # main trigger: cron-job.org -> workflow_dispatch every 5 minutes (GitHub's own schedule is best-effort);
    # this hourly run is only a backup in case the external trigger stops
    - cron: "17 * * * *"
  workflow_dispatch: {}        # "Run workflow" button for a manual update

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gex-levels
  cancel-in-progress: false

jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calculate GEX levels
        run: python gex.py
        env:
          # optional New Relic events "GexRun" / "GexJob" (Settings -> Secrets and variables -> Actions)
          NR_LICENSE_KEY: ${{ secrets.NR_LICENSE_KEY }}
          NR_REGION: ${{ vars.NR_REGION }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
